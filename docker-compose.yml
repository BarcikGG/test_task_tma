services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: ./server/.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./server/.env
    ports:
      - "5094:5094"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://server:5094
    restart: unless-stopped
    depends_on:
      - server
    env_file: ./frontend/.env
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  uploads:
